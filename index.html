<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday Sudri 🎈</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;1,400&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="stars" id="stars"></div>
<button id="musicBtn" aria-label="Toggle music">🎵</button>
<audio id="music" src="music.mp3" loop></audio>

<!-- SCREEN 1: balloons -->
<section class="screen active" id="s1">
  <h1 id="title1">It’s Your Birthday! 🎈</h1>
  <p class="sub" id="sub1">Pop a balloon to begin</p>
  <div id="balloons"></div>
</section>

<!-- SCREEN 2: flowers -->
<section class="screen" id="s2">
  <h2 id="title2">Today, pluck a flower to discover 29 reasons why I like you 🌸</h2>
  <p class="counter"><span id="count">0</span> of 29</p>
  <div id="garden"></div>
  <div id="reasonCard" class="reason-card hidden">
    <p class="rnum" id="rnum"></p>
    <p id="rtext"></p>
    <button id="rnext">Keep going</button>
  </div>
</section>

<!-- SCREEN 3: cheers -->
<section class="screen" id="s3">
  <h2 class="big">Cheers to the memories 🥂</h2>
  <button class="main-btn" id="memBtn">See our memories</button>
</section>

<!-- SCREEN 4: photo reel -->
<section class="screen" id="s4">
  <div class="bars" id="bars"></div>
  <div class="reel" id="reel">
    <img id="photo" alt="">
    <div class="cap"><p class="date" id="pdate"></p><p id="pcap"></p></div>
  </div>
  <div class="end hidden" id="end">
    <h2 id="endText"></h2>
    <button class="main-btn" id="replay">Watch again</button>
  </div>
</section>

<script src="script.js"></script>
</body>
</html>
